      - DEEP_AGENT_LANGGRAPH_MAX_OUTPUT_CHARS=${DEEP_AGENT_LANGGRAPH_MAX_OUTPUT_CHARS:?DEEP_AGENT_LANGGRAPH_MAX_OUTPUT_CHARS must be set}
      - DEEP_AGENT_LANGGRAPH_MAX_EVENT_COUNT=${DEEP_AGENT_LANGGRAPH_MAX_EVENT_COUNT:?DEEP_AGENT_LANGGRAPH_MAX_EVENT_COUNT must be set}
      - DEEP_AGENT_LANGGRAPH_WAKE_LIMIT_SECONDS=${DEEP_AGENT_LANGGRAPH_WAKE_LIMIT_SECONDS:?DEEP_AGENT_LANGGRAPH_WAKE_LIMIT_SECONDS must be set}
      - DEEP_AGENT_LANGGRAPH_SUBAGENT_TIMEOUT_MS=${DEEP_AGENT_LANGGRAPH_SUBAGENT_TIMEOUT_MS:?DEEP_AGENT_LANGGRAPH_SUBAGENT_TIMEOUT_MS must be set}
