      runtime-checkpoint-db-init:
        condition: service_completed_successfully
      runtime-db-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8100/readyz"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  hermes-config-init:
    profiles: ["hermes"]
    build:
      context: .
      dockerfile: hermes_runtime/Dockerfile
    command: ["python", "-m", "hermes_runtime.profile_manager"]
    environment:
      - HERMES_DATA_ROOT=/opt/data
      - HERMES_CONFIG_TEMPLATE_ROOT=/app/hermes_runtime
      - HERMES_MODEL_PROVIDER=${HERMES_MODEL_PROVIDER:?HERMES_MODEL_PROVIDER must be set in .env}
      - HERMES_MODEL_CONTEXT_LENGTH=${HERMES_MODEL_CONTEXT_LENGTH:?HERMES_MODEL_CONTEXT_LENGTH must be set in .env}
      - HERMES_PROFILE_ROOT=${HERMES_PROFILE_ROOT:?HERMES_PROFILE_ROOT must be set in .env}
      - HERMES_PROFILE_UID=${HERMES_PROFILE_UID:?HERMES_PROFILE_UID must be set in .env}
      - HERMES_PROFILE_GID=${HERMES_PROFILE_GID:?HERMES_PROFILE_GID must be set in .env}
      - API_SERVER_KEY=${API_SERVER_KEY:?API_SERVER_KEY must be set in .env}
      - HERMES_MCP_CONTEXT_SECRET=${HERMES_MCP_CONTEXT_SECRET:?HERMES_MCP_CONTEXT_SECRET must be set in .env}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    env_file: []
    volumes:
      - hermes_data:/opt/data

  hermes:
    profiles: ["hermes"]
    build:
      # Keep this pinned revision visible for consistency checks; the actual
      # build context is always supplied by HERMES_UPSTREAM_REVISION in .env.
      # Pinned revision: bdd0a79c6a0ebc2344d5d6913c70bd89fa59c894
      context: https://github.com/NousResearch/hermes-agent.git#${HERMES_UPSTREAM_REVISION:?HERMES_UPSTREAM_REVISION must be set in .env}
    environment:
      - API_SERVER_ENABLED=true
      - API_SERVER_HOST=0.0.0.0
      - API_SERVER_PORT=8642
      - GATEWAY_MULTIPLEX_PROFILES=true
      - ASKPDF_HERMES_COMPAT_ENABLED=1
      - PYTHONPATH=/opt/askpdf-hermes-pinned-patch
    env_file: []
    command: ["gateway"]
    depends_on:
      hermes-config-init:
        condition: service_completed_successfully
      rag-service:
        condition: service_started
    volumes:
      - hermes_data:/opt/data
      - ./.env:/opt/data/.env:ro
      - ./.env:/opt/data/profiles/askpdf-deep-offline/.env:ro
      - ./.env:/opt/data/profiles/askpdf-deep-external/.env:ro
      - ./hermes_runtime/hermes_pinned_patch:/opt/askpdf-hermes-pinned-patch:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8642/health"]
      interval: 10s
      timeout: 5s
      retries: 30

  hermes-runtime:
    profiles: ["hermes"]
    build:
      context: .
      dockerfile: hermes_runtime/Dockerfile
    environment:
      - LOG_LEVEL=INFO
      - HERMES_API_URL=http://hermes:8642
      - ASKPDF_MCP_URL=http://rag-service:8000/internal/mcp/
      - ASKPDF_MCP_HEALTH_URL=http://rag-service:8000/health
      - HERMES_API_TOKEN=${API_SERVER_KEY:?API_SERVER_KEY must be set in .env}
      - API_SERVER_KEY=${API_SERVER_KEY:?API_SERVER_KEY must be set in .env}
      - ASKPDF_MCP_REQUIRED=${ASKPDF_MCP_REQUIRED:?ASKPDF_MCP_REQUIRED must be set in .env}
      - HERMES_MCP_CONTEXT_SECRET=${HERMES_MCP_CONTEXT_SECRET:?HERMES_MCP_CONTEXT_SECRET must be set in .env}
      - HERMES_UPSTREAM_REVISION=${HERMES_UPSTREAM_REVISION:?HERMES_UPSTREAM_REVISION must be set in .env}
      - HERMES_MODEL_PROVIDER=${HERMES_MODEL_PROVIDER:?HERMES_MODEL_PROVIDER must be set in .env}
      - HERMES_MODEL_CONTEXT_LENGTH=${HERMES_MODEL_CONTEXT_LENGTH:?HERMES_MODEL_CONTEXT_LENGTH must be set in .env}
      - HERMES_RUNTIME_VERSION=${HERMES_RUNTIME_VERSION:?HERMES_RUNTIME_VERSION must be set in .env}
      - HERMES_RUNTIME_STATE_PATH=${HERMES_RUNTIME_STATE_PATH:?HERMES_RUNTIME_STATE_PATH must be set in .env}
      - HERMES_RUNTIME_STORAGE_BACKEND=${HERMES_RUNTIME_STORAGE_BACKEND:?HERMES_RUNTIME_STORAGE_BACKEND must be set in .env}
      - HERMES_RUNTIME_EVENT_ID_MODE=${HERMES_RUNTIME_EVENT_ID_MODE:?HERMES_RUNTIME_EVENT_ID_MODE must be set in .env}
      - HERMES_RUN_PROFILE_MAX_AGE_SECONDS=${HERMES_RUN_PROFILE_MAX_AGE_SECONDS:?HERMES_RUN_PROFILE_MAX_AGE_SECONDS must be set in .env}
      - HERMES_RUN_PROFILE_SWEEP_INTERVAL_SECONDS=${HERMES_RUN_PROFILE_SWEEP_INTERVAL_SECONDS:?HERMES_RUN_PROFILE_SWEEP_INTERVAL_SECONDS must be set in .env}
      - HERMES_PROFILE_ROOT=${HERMES_PROFILE_ROOT:?HERMES_PROFILE_ROOT must be set in .env}
      - HERMES_PROFILE_UID=${HERMES_PROFILE_UID:?HERMES_PROFILE_UID must be set in .env}
      - HERMES_PROFILE_GID=${HERMES_PROFILE_GID:?HERMES_PROFILE_GID must be set in .env}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - LLM_API_URL=${LLM_API_URL:?LLM_API_URL must be set in .env}
      - MCP_TRANSPORT=loopback_http
      - MCP_LOOPBACK_URL=http://rag-service:8000/internal/mcp/
      - MCP_REQUEST_TIMEOUT_SECONDS=${MCP_REQUEST_TIMEOUT_SECONDS:?MCP_REQUEST_TIMEOUT_SECONDS must be set in .env}
      - MCP_OTEL_ENABLED=${MCP_OTEL_ENABLED:?MCP_OTEL_ENABLED must be set in .env}
      - AGENT_RUNTIME_LEASE_SECONDS=${AGENT_RUNTIME_LEASE_SECONDS:?AGENT_RUNTIME_LEASE_SECONDS must be set in .env}
      - AGENT_RUNTIME_CONNECT_TIMEOUT_SECONDS=${AGENT_RUNTIME_CONNECT_TIMEOUT_SECONDS:?AGENT_RUNTIME_CONNECT_TIMEOUT_SECONDS must be set in .env}
      - AGENT_RUNTIME_WRITE_TIMEOUT_SECONDS=${AGENT_RUNTIME_WRITE_TIMEOUT_SECONDS:?AGENT_RUNTIME_WRITE_TIMEOUT_SECONDS must be set in .env}
      - AGENT_RUNTIME_READ_TIMEOUT_SECONDS=${AGENT_RUNTIME_READ_TIMEOUT_SECONDS:?AGENT_RUNTIME_READ_TIMEOUT_SECONDS must be set in .env}
      - AGENT_RUNTIME_RECONNECT_MAX_ATTEMPTS=${AGENT_RUNTIME_RECONNECT_MAX_ATTEMPTS:?AGENT_RUNTIME_RECONNECT_MAX_ATTEMPTS must be set in .env}
      - AGENT_RUNTIME_RECONNECT_BACKOFF_SECONDS=${AGENT_RUNTIME_RECONNECT_BACKOFF_SECONDS:?AGENT_RUNTIME_RECONNECT_BACKOFF_SECONDS must be set in .env}
      - AGENT_RUNTIME_RECONNECT_DEADLINE_SECONDS=${AGENT_RUNTIME_RECONNECT_DEADLINE_SECONDS:?AGENT_RUNTIME_RECONNECT_DEADLINE_SECONDS must be set in .env}
      - AGENT_RUNTIME_OUTPUT_DELTA_FLUSH_SECONDS=${AGENT_RUNTIME_OUTPUT_DELTA_FLUSH_SECONDS:?AGENT_RUNTIME_OUTPUT_DELTA_FLUSH_SECONDS must be set in .env}
      - AGENT_RUNTIME_OUTPUT_DELTA_FLUSH_BYTES=${AGENT_RUNTIME_OUTPUT_DELTA_FLUSH_BYTES:?AGENT_RUNTIME_OUTPUT_DELTA_FLUSH_BYTES must be set in .env}
      - AGENT_RUNTIME_SHUTDOWN_GRACE_SECONDS=${AGENT_RUNTIME_SHUTDOWN_GRACE_SECONDS:?AGENT_RUNTIME_SHUTDOWN_GRACE_SECONDS must be set in .env}
      - AGENT_RUNTIME_CANCEL_CONFIRM_TIMEOUT_SECONDS=${AGENT_RUNTIME_CANCEL_CONFIRM_TIMEOUT_SECONDS:?AGENT_RUNTIME_CANCEL_CONFIRM_TIMEOUT_SECONDS must be set in .env}
      - AGENT_RUNTIME_TERMINAL_CONFIRM_TIMEOUT_SECONDS=${AGENT_RUNTIME_TERMINAL_CONFIRM_TIMEOUT_SECONDS:?AGENT_RUNTIME_TERMINAL_CONFIRM_TIMEOUT_SECONDS must be set in .env}
      - AGENT_EVENT_POLL_INTERVAL_SECONDS=${AGENT_EVENT_POLL_INTERVAL_SECONDS:?AGENT_EVENT_POLL_INTERVAL_SECONDS must be set in .env}
      - AGENT_SSE_HEARTBEAT_INTERVAL_SECONDS=${AGENT_SSE_HEARTBEAT_INTERVAL_SECONDS:?AGENT_SSE_HEARTBEAT_INTERVAL_SECONDS must be set in .env}
      - AGENT_CANCELLATION_POLL_INTERVAL_SECONDS=${AGENT_CANCELLATION_POLL_INTERVAL_SECONDS:?AGENT_CANCELLATION_POLL_INTERVAL_SECONDS must be set in .env}
      - AGENT_RUNTIME_DEPENDENCY_REFRESH_SECONDS=${AGENT_RUNTIME_DEPENDENCY_REFRESH_SECONDS:?AGENT_RUNTIME_DEPENDENCY_REFRESH_SECONDS must be set in .env}
      - AGENT_RUNTIME_DEPENDENCY_TIMEOUT_SECONDS=${AGENT_RUNTIME_DEPENDENCY_TIMEOUT_SECONDS:?AGENT_RUNTIME_DEPENDENCY_TIMEOUT_SECONDS must be set in .env}
      - AGENT_RUNTIME_DEPENDENCY_STALE_SECONDS=${AGENT_RUNTIME_DEPENDENCY_STALE_SECONDS:?AGENT_RUNTIME_DEPENDENCY_STALE_SECONDS must be set in .env}
      - AGENT_RUNTIME_DEPENDENCY_JITTER_RATIO=${AGENT_RUNTIME_DEPENDENCY_JITTER_RATIO:?AGENT_RUNTIME_DEPENDENCY_JITTER_RATIO must be set in .env}
      - AGENT_RUNTIME_RECOVERY_INTERVAL_SECONDS=${AGENT_RUNTIME_RECOVERY_INTERVAL_SECONDS:?AGENT_RUNTIME_RECOVERY_INTERVAL_SECONDS must be set in .env}
      - AGENT_RUNTIME_RECOVERY_BATCH_SIZE=${AGENT_RUNTIME_RECOVERY_BATCH_SIZE:?AGENT_RUNTIME_RECOVERY_BATCH_SIZE must be set in .env}
      - NEXT_PUBLIC_AGENT_TASK_POLL_INTERVAL_MS=${NEXT_PUBLIC_AGENT_TASK_POLL_INTERVAL_MS:?NEXT_PUBLIC_AGENT_TASK_POLL_INTERVAL_MS must be set in .env}
      - NEXT_PUBLIC_AGENT_SSE_RECONNECT_INTERVAL_MS=${NEXT_PUBLIC_AGENT_SSE_RECONNECT_INTERVAL_MS:?NEXT_PUBLIC_AGENT_SSE_RECONNECT_INTERVAL_MS must be set in .env}
      - DEEP_AGENT_HERMES_MAX_MODEL_CALLS=${DEEP_AGENT_HERMES_MAX_MODEL_CALLS:?DEEP_AGENT_HERMES_MAX_MODEL_CALLS must be set in .env}
      - DEEP_AGENT_HERMES_MAX_MODEL_TOKENS=${DEEP_AGENT_HERMES_MAX_MODEL_TOKENS:?DEEP_AGENT_HERMES_MAX_MODEL_TOKENS must be set in .env}
      - DEEP_AGENT_HERMES_MAX_TOOL_CALLS=${DEEP_AGENT_HERMES_MAX_TOOL_CALLS:?DEEP_AGENT_HERMES_MAX_TOOL_CALLS must be set in .env}
      - DEEP_AGENT_HERMES_MAX_ACTIVE_RUNTIME_MS=${DEEP_AGENT_HERMES_MAX_ACTIVE_RUNTIME_MS:?DEEP_AGENT_HERMES_MAX_ACTIVE_RUNTIME_MS must be set in .env}
      - DEEP_AGENT_HERMES_MAX_DURATION_MS=${DEEP_AGENT_HERMES_MAX_DURATION_MS:?DEEP_AGENT_HERMES_MAX_DURATION_MS must be set in .env}
      - DEEP_AGENT_HERMES_MAX_OUTPUT_CHARS=${DEEP_AGENT_HERMES_MAX_OUTPUT_CHARS:?DEEP_AGENT_HERMES_MAX_OUTPUT_CHARS must be set in .env}
      - DEEP_AGENT_HERMES_MAX_EVENT_COUNT=${DEEP_AGENT_HERMES_MAX_EVENT_COUNT:?DEEP_AGENT_HERMES_MAX_EVENT_COUNT must be set in .env}
      - DEEP_AGENT_HERMES_WAKE_LIMIT_SECONDS=${DEEP_AGENT_HERMES_WAKE_LIMIT_SECONDS:?DEEP_AGENT_HERMES_WAKE_LIMIT_SECONDS must be set in .env}
    env_file: []
    depends_on:
      hermes:
        condition: service_healthy
      rag-service:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8200/readyz"]
      interval: 10s
      timeout: 5s
      retries: 12
    volumes:
      - hermes_runtime_state:/var/lib/hermes
      - hermes_data:/opt/data

  runtime-checkpoint-db-init:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      PGPASSWORD: postgres
    depends_on:
      postgresql:
        condition: service_healthy
    command:
      - /bin/sh
      - -c
      - >-
        until pg_isready -h postgresql -U postgres -d askpdf; do sleep 1; done;
        if [ "$$(psql -h postgresql -U postgres -d askpdf -tAc "SELECT 1 FROM pg_database WHERE datname='runtime_checkpoints'")" != "1" ]; then
          createdb -h postgresql -U postgres runtime_checkpoints;
        fi

  runtime-db-migrate:
    image: askpdf-langgraph-runtime
    build:
      context: .
      dockerfile: langgraph_runtime/Dockerfile
    command: ["python", "-m", "langgraph_runtime.migrate"]
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgresql:5432/runtime_checkpoints
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgresql:5432/runtime_checkpoints
      POSTGRES_POOL_SIZE: "1"
      POSTGRES_MAX_OVERFLOW: "1"
      AGENT_RUNTIME_EXECUTION_DATABASE_URL: postgresql://postgres:postgres@postgresql:5432/runtime_checkpoints
      RUN_RUNTIME_DB_MIGRATIONS: ${RUN_RUNTIME_DB_MIGRATIONS:-true}
    depends_on:
      runtime-checkpoint-db-init:
        condition: service_completed_successfully
  db-migrate:
    build:
      context: .
      dockerfile: rag_service/Dockerfile
    command: ["python", "-m", "app.db.migrate"]
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgresql:5432/askpdf
      - TEST_DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgresql:5432/test_askpdf
      - POSTGRES_POOL_SIZE=10
      - POSTGRES_MAX_OVERFLOW=20
      - RUN_DB_MIGRATIONS=${RUN_DB_MIGRATIONS:-true}
      - WEAVIATE_URL=http://weaviate:8080
      - WEAVIATE_HYBRID_ALPHA=${WEAVIATE_HYBRID_ALPHA:-0.7}
      - CAPTURE_SERVICE_URL=http://browser-capture:8080
    env_file:
      - path: .env
        required: true
    depends_on:
      postgresql:
        condition: service_healthy
    volumes:
      - ./rag_service:/app

  weaviate:
    image: cr.weaviate.io/semitechnologies/weaviate:1.36.2
    ports:
      - "8080:8080"
      - "50051:50051"
    environment:
      - QUERY_DEFAULTS_LIMIT=${QUERY_DEFAULTS_LIMIT:-20}
      - AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED=true
      - PERSISTENCE_DATA_PATH=/var/lib/weaviate
      - DEFAULT_VECTORIZER_MODULE=none
      - ENABLE_API_BASED_MODULES=true
      - CLUSTER_HOSTNAME=node1
    healthcheck:
      #test: [ "CMD", "curl", "-f", "http://localhost:8080/v1/.well-known/ready" ]
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/v1/.well-known/ready || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    volumes:
      - weaviate_data:/var/lib/weaviate

  postgresql:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: askpdf
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d askpdf"]
      interval: 5s
      timeout: 5s
      retries: 5

  browser-capture:
    build:
      context: ./browser_capture
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8090:3000"  # Browser web UI for iframe access (localhost only)
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      # CDP is loopback-only inside this container; rag-service talks to the capture API over Docker DNS.
      - BRAVE_CLI=--remote-debugging-address=127.0.0.1 --remote-debugging-port=9222 --no-first-run --no-default-browser-check
      - BROWSER_DEBUG_URL=127.0.0.1:9222
      - CUSTOM_PORT=3000
      # Enable Selkies clipboard functionality
      - SELKIES_CLIPBOARD_ENABLED=${SELKIES_CLIPBOARD_ENABLED:-true}
      - SELKIES_CLIPBOARD_BRIDGE_ENABLED=${SELKIES_CLIPBOARD_BRIDGE_ENABLED:-true}
      # Disable Selkies gaming features
      - SELKIES_GAMEPAD_ENABLED=${SELKIES_GAMEPAD_ENABLED:-false}
      - SELKIES_UI_SIDEBAR_SHOW_GAMEPADS=${SELKIES_UI_SIDEBAR_SHOW_GAMEPADS:-false}
      - SELKIES_UI_SIDEBAR_SHOW_GAMING_MODE=${SELKIES_UI_SIDEBAR_SHOW_GAMING_MODE:-false}
      # Disable Selkies sharing features  
      - SELKIES_UI_SIDEBAR_SHOW_SHARING=${SELKIES_UI_SIDEBAR_SHOW_SHARING:-false}
      # Disable Selkies apps features
      - SELKIES_UI_SIDEBAR_SHOW_APPS=${SELKIES_UI_SIDEBAR_SHOW_APPS:-false}
    shm_size: '2gb'
    volumes:
      - browser_captures:/captures
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

volumes:
  weaviate_data:
  pdf_data:
  postgres_data:
  browser_captures:
  hermes_runtime_state:
  hermes_data:
