services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: runtime
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
        NEXT_PUBLIC_AGENT_TASK_POLL_INTERVAL_MS: ${NEXT_PUBLIC_AGENT_TASK_POLL_INTERVAL_MS:?NEXT_PUBLIC_AGENT_TASK_POLL_INTERVAL_MS must be set in .env}
        NEXT_PUBLIC_AGENT_SSE_RECONNECT_INTERVAL_MS: ${NEXT_PUBLIC_AGENT_SSE_RECONNECT_INTERVAL_MS:?NEXT_PUBLIC_AGENT_SSE_RECONNECT_INTERVAL_MS must be set in .env}
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    env_file:
      - path: .env
        required: true
    depends_on:
      rag-service:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:3000" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  rag-service:
    build:
      context: .
      dockerfile: rag_service/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - LOG_LEVEL=INFO
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgresql:5432/askpdf
      - TEST_DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgresql:5432/test_askpdf
      - POSTGRES_POOL_SIZE=10
      - POSTGRES_MAX_OVERFLOW=20
      - WEAVIATE_URL=http://weaviate:8080
      - WEAVIATE_HYBRID_ALPHA=${WEAVIATE_HYBRID_ALPHA:-0.7}
      - CAPTURE_SERVICE_URL=http://browser-capture:8080
      - AGENT_CHECKPOINT_DATABASE_URL=
      - AGENT_RUNTIME_EXECUTION_DATABASE_URL=
      - LANGGRAPH_RUNTIME_BINDING_SECRET=
    env_file:
      - path: .env
        required: true
    depends_on:
      postgresql:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
      weaviate:
        condition: service_healthy
    volumes:
      - ./rag_service:/app
      - ./data:/data
      - pdf_data:/static
      - browser_captures:/captures:ro  # Read access to browser captures
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: [ "CMD", "sh", "-c", "curl -f http://localhost:8000/ready && curl -f http://weaviate:8080/v1/.well-known/ready" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  langgraph-runtime:
    image: askpdf-langgraph-runtime
    build:
      context: .
      dockerfile: langgraph_runtime/Dockerfile
    env_file: []
    environment:
      - LOG_LEVEL=INFO
      - MCP_TRANSPORT=loopback_http
      - MCP_LOOPBACK_URL=http://rag-service:8000/internal/mcp/
      - MCP_REQUEST_TIMEOUT_SECONDS=${MCP_REQUEST_TIMEOUT_SECONDS:?MCP_REQUEST_TIMEOUT_SECONDS must be set}
      - MCP_OTEL_ENABLED=${MCP_OTEL_ENABLED:?MCP_OTEL_ENABLED must be set}
      - LANGGRAPH_RUNTIME_TOKEN=${LANGGRAPH_RUNTIME_TOKEN:?LANGGRAPH_RUNTIME_TOKEN must be set}
      - LANGGRAPH_RUNTIME_BINDING_SECRET=${LANGGRAPH_RUNTIME_BINDING_SECRET:?LANGGRAPH_RUNTIME_BINDING_SECRET must be set}
      - ASKPDF_AGENT_CHECKPOINTER=${ASKPDF_AGENT_CHECKPOINTER:?ASKPDF_AGENT_CHECKPOINTER must be set}
      - ASKPDF_AGENT_CHECKPOINTER_SETUP=${ASKPDF_AGENT_CHECKPOINTER_SETUP:?ASKPDF_AGENT_CHECKPOINTER_SETUP must be set}
      - AGENT_CHECKPOINT_DATABASE_URL=${AGENT_CHECKPOINT_DATABASE_URL:?AGENT_CHECKPOINT_DATABASE_URL must be set}
      - AGENT_RUNTIME_EXECUTION_DATABASE_URL=${AGENT_RUNTIME_EXECUTION_DATABASE_URL:?AGENT_RUNTIME_EXECUTION_DATABASE_URL must be set}
      - LLM_API_URL=${LLM_API_URL:?LLM_API_URL must be set}
      - OPENAI_API_KEY=${OPENAI_API_KEY-}
      - LLM_AUTH_MODE=${LLM_AUTH_MODE:?LLM_AUTH_MODE must be set}
      - LLM_KEYLESS_PROVIDER=${LLM_KEYLESS_PROVIDER-}
      - DEFAULT_TOKEN_BUDGET=${DEFAULT_TOKEN_BUDGET:?DEFAULT_TOKEN_BUDGET must be set}
      - REPLANS_LIMIT=${REPLANS_LIMIT:?REPLANS_LIMIT must be set}
      - MAX_CUSTOM_INSTRUCTIONS_CHARS=${MAX_CUSTOM_INSTRUCTIONS_CHARS:?MAX_CUSTOM_INSTRUCTIONS_CHARS must be set}
      - MAX_SYSTEM_ROLE_CHARS=${MAX_SYSTEM_ROLE_CHARS:?MAX_SYSTEM_ROLE_CHARS must be set}
      - AGENT_RUNTIME_LEASE_SECONDS=${AGENT_RUNTIME_LEASE_SECONDS:?AGENT_RUNTIME_LEASE_SECONDS must be set}
      - AGENT_RUNTIME_CONNECT_TIMEOUT_SECONDS=${AGENT_RUNTIME_CONNECT_TIMEOUT_SECONDS:?AGENT_RUNTIME_CONNECT_TIMEOUT_SECONDS must be set}
      - AGENT_RUNTIME_WRITE_TIMEOUT_SECONDS=${AGENT_RUNTIME_WRITE_TIMEOUT_SECONDS:?AGENT_RUNTIME_WRITE_TIMEOUT_SECONDS must be set}
      - AGENT_RUNTIME_READ_TIMEOUT_SECONDS=${AGENT_RUNTIME_READ_TIMEOUT_SECONDS:?AGENT_RUNTIME_READ_TIMEOUT_SECONDS must be set}
      - AGENT_RUNTIME_SHUTDOWN_GRACE_SECONDS=${AGENT_RUNTIME_SHUTDOWN_GRACE_SECONDS:?AGENT_RUNTIME_SHUTDOWN_GRACE_SECONDS must be set}
      - AGENT_RUNTIME_CANCEL_CONFIRM_TIMEOUT_SECONDS=${AGENT_RUNTIME_CANCEL_CONFIRM_TIMEOUT_SECONDS:?AGENT_RUNTIME_CANCEL_CONFIRM_TIMEOUT_SECONDS must be set}
      - AGENT_RUNTIME_TERMINAL_CONFIRM_TIMEOUT_SECONDS=${AGENT_RUNTIME_TERMINAL_CONFIRM_TIMEOUT_SECONDS:?AGENT_RUNTIME_TERMINAL_CONFIRM_TIMEOUT_SECONDS must be set}
      - AGENT_EVENT_POLL_INTERVAL_SECONDS=${AGENT_EVENT_POLL_INTERVAL_SECONDS:?AGENT_EVENT_POLL_INTERVAL_SECONDS must be set}
      - AGENT_SSE_HEARTBEAT_INTERVAL_SECONDS=${AGENT_SSE_HEARTBEAT_INTERVAL_SECONDS:?AGENT_SSE_HEARTBEAT_INTERVAL_SECONDS must be set}
      - AGENT_CANCELLATION_POLL_INTERVAL_SECONDS=${AGENT_CANCELLATION_POLL_INTERVAL_SECONDS:?AGENT_CANCELLATION_POLL_INTERVAL_SECONDS must be set}
      - AGENT_RUNTIME_DEPENDENCY_REFRESH_SECONDS=${AGENT_RUNTIME_DEPENDENCY_REFRESH_SECONDS:?AGENT_RUNTIME_DEPENDENCY_REFRESH_SECONDS must be set}
      - AGENT_RUNTIME_DEPENDENCY_TIMEOUT_SECONDS=${AGENT_RUNTIME_DEPENDENCY_TIMEOUT_SECONDS:?AGENT_RUNTIME_DEPENDENCY_TIMEOUT_SECONDS must be set}
      - AGENT_RUNTIME_DEPENDENCY_STALE_SECONDS=${AGENT_RUNTIME_DEPENDENCY_STALE_SECONDS:?AGENT_RUNTIME_DEPENDENCY_STALE_SECONDS must be set}
      - AGENT_RUNTIME_DEPENDENCY_JITTER_RATIO=${AGENT_RUNTIME_DEPENDENCY_JITTER_RATIO:?AGENT_RUNTIME_DEPENDENCY_JITTER_RATIO must be set}
      - AGENT_RUNTIME_RECOVERY_INTERVAL_SECONDS=${AGENT_RUNTIME_RECOVERY_INTERVAL_SECONDS:?AGENT_RUNTIME_RECOVERY_INTERVAL_SECONDS must be set}
      - AGENT_RUNTIME_RECOVERY_BATCH_SIZE=${AGENT_RUNTIME_RECOVERY_BATCH_SIZE:?AGENT_RUNTIME_RECOVERY_BATCH_SIZE must be set}
      - AGENT_RUNTIME_RECOVERY_LOOP_ENABLED=${AGENT_RUNTIME_RECOVERY_LOOP_ENABLED:?AGENT_RUNTIME_RECOVERY_LOOP_ENABLED must be set}
      - AGENT_RUNTIME_RECONNECT_MAX_ATTEMPTS=${AGENT_RUNTIME_RECONNECT_MAX_ATTEMPTS:?AGENT_RUNTIME_RECONNECT_MAX_ATTEMPTS must be set}
      - AGENT_RUNTIME_RECONNECT_BACKOFF_SECONDS=${AGENT_RUNTIME_RECONNECT_BACKOFF_SECONDS:?AGENT_RUNTIME_RECONNECT_BACKOFF_SECONDS must be set}
      - AGENT_RUNTIME_RECONNECT_DEADLINE_SECONDS=${AGENT_RUNTIME_RECONNECT_DEADLINE_SECONDS:?AGENT_RUNTIME_RECONNECT_DEADLINE_SECONDS must be set}
      - AGENT_RUNTIME_OUTPUT_DELTA_FLUSH_SECONDS=${AGENT_RUNTIME_OUTPUT_DELTA_FLUSH_SECONDS:?AGENT_RUNTIME_OUTPUT_DELTA_FLUSH_SECONDS must be set}
      - AGENT_RUNTIME_OUTPUT_DELTA_FLUSH_BYTES=${AGENT_RUNTIME_OUTPUT_DELTA_FLUSH_BYTES:?AGENT_RUNTIME_OUTPUT_DELTA_FLUSH_BYTES must be set}
      - NEXT_PUBLIC_AGENT_TASK_POLL_INTERVAL_MS=${NEXT_PUBLIC_AGENT_TASK_POLL_INTERVAL_MS:?NEXT_PUBLIC_AGENT_TASK_POLL_INTERVAL_MS must be set}
      - NEXT_PUBLIC_AGENT_SSE_RECONNECT_INTERVAL_MS=${NEXT_PUBLIC_AGENT_SSE_RECONNECT_INTERVAL_MS:?NEXT_PUBLIC_AGENT_SSE_RECONNECT_INTERVAL_MS must be set}
      - DEEP_AGENT_LANGGRAPH_MAX_MODEL_CALLS=${DEEP_AGENT_LANGGRAPH_MAX_MODEL_CALLS:?DEEP_AGENT_LANGGRAPH_MAX_MODEL_CALLS must be set}
      - DEEP_AGENT_LANGGRAPH_MAX_MODEL_TOKENS=${DEEP_AGENT_LANGGRAPH_MAX_MODEL_TOKENS:?DEEP_AGENT_LANGGRAPH_MAX_MODEL_TOKENS must be set}
      - DEEP_AGENT_LANGGRAPH_MAX_TOOL_CALLS=${DEEP_AGENT_LANGGRAPH_MAX_TOOL_CALLS:?DEEP_AGENT_LANGGRAPH_MAX_TOOL_CALLS must be set}
      - DEEP_AGENT_LANGGRAPH_MAX_ACTIVE_RUNTIME_MS=${DEEP_AGENT_LANGGRAPH_MAX_ACTIVE_RUNTIME_MS:?DEEP_AGENT_LANGGRAPH_MAX_ACTIVE_RUNTIME_MS must be set}
