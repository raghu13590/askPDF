services:
  postgresql:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: askpdf
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d askpdf"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - runtime_integration_postgres_data:/var/lib/postgresql/data

  runtime-checkpoint-db-init:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      PGPASSWORD: postgres
    depends_on:
      postgresql:
        condition: service_healthy
    command:
      - /bin/sh
      - -c
      - >-
        until pg_isready -h postgresql -U postgres -d askpdf; do sleep 1; done;
        if [ "$$(psql -h postgresql -U postgres -d askpdf -tAc "SELECT 1 FROM pg_database WHERE datname='runtime_checkpoints'")" != "1" ]; then
          createdb -h postgresql -U postgres runtime_checkpoints;
        fi

  weaviate:
    image: cr.weaviate.io/semitechnologies/weaviate:1.36.2
    environment:
      QUERY_DEFAULTS_LIMIT: 20
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
      PERSISTENCE_DATA_PATH: /var/lib/weaviate
      DEFAULT_VECTORIZER_MODULE: none
      ENABLE_API_BASED_MODULES: "true"
      CLUSTER_HOSTNAME: runtime-integration-test
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/v1/.well-known/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    volumes:
      - runtime_integration_weaviate_data:/var/lib/weaviate

  rag-service:
    image: askpdf-runtime-control-plane
    build:
      context: .
      dockerfile: rag_service/Dockerfile
      args:
        DOWNLOAD_LOCAL_MODELS: "false"
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      LOG_LEVEL: INFO
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgresql:5432/askpdf
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgresql:5432/askpdf
      POSTGRES_POOL_SIZE: "5"
      POSTGRES_MAX_OVERFLOW: "5"
      AGENT_CHECKPOINT_DATABASE_URL: ""
      AGENT_RUNTIME_EXECUTION_DATABASE_URL: ""
      LANGGRAPH_RUNTIME_BINDING_SECRET: ""
      LANGGRAPH_RUNTIME_URL: http://langgraph-runtime:8100
      LANGGRAPH_RUNTIME_TOKEN: langgraph-runtime-integration-token-012345678901234567890123
      COMPOSE_PROFILES: ${HERMES_RUNTIME_COMPOSE_PROFILES:-}
      HERMES_MODEL_CONTEXT_LENGTH: ${HERMES_MODEL_CONTEXT_LENGTH:?HERMES_MODEL_CONTEXT_LENGTH must be set in .env}
      HERMES_MODEL_PROVIDER: lmstudio
      HERMES_MCP_CONTEXT_SECRET: hermes-runtime-hermes-context-secret-32-bytes-minimum
      WEAVIATE_URL: http://weaviate:8080
      MCP_TRANSPORT: in_process
      MCP_LOOPBACK_URL: http://127.0.0.1:8000/internal/mcp/
      MCP_REQUEST_TIMEOUT_SECONDS: "120"
      LLM_API_URL: ${EXTERNAL_RUNTIME_LLM_API_URL:-http://fake-llm:9000/v1}
      ASKPDF_REPO_DIR: /workspace
    env_file:
      - path: .env
        required: true
    depends_on:
      postgresql:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
      runtime-checkpoint-db-init:
        condition: service_completed_successfully
      weaviate:
        condition: service_healthy
    volumes:
      - runtime_integration_product_data:/static
    extra_hosts:
      - host.docker.internal:host-gateway
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  db-migrate:
    image: askpdf-runtime-control-plane
    command: ["python", "-m", "app.db.migrate"]
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgresql:5432/askpdf
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgresql:5432/askpdf
      POSTGRES_POOL_SIZE: "5"
      POSTGRES_MAX_OVERFLOW: "5"
      RUN_DB_MIGRATIONS: "true"
      LOCAL_EMBEDDING_MODEL: BAAI/bge-m3
      LOCAL_RERANKER_MODEL: BAAI/bge-reranker-v2-m3
    depends_on:
      postgresql:
        condition: service_healthy

  runtime-db-migrate:
    image: askpdf-langgraph-runtime
    build:
      context: .
      dockerfile: langgraph_runtime/Dockerfile
    command: ["python", "-m", "langgraph_runtime.migrate"]
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgresql:5432/runtime_checkpoints
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgresql:5432/runtime_checkpoints
      POSTGRES_POOL_SIZE: "1"
      POSTGRES_MAX_OVERFLOW: "1"
      AGENT_RUNTIME_EXECUTION_DATABASE_URL: postgresql://postgres:postgres@postgresql:5432/runtime_checkpoints
      RUN_RUNTIME_DB_MIGRATIONS: "true"
    depends_on:
      runtime-checkpoint-db-init:
        condition: service_completed_successfully

  langgraph-runtime:
    image: askpdf-langgraph-runtime
    build:
      context: .
      dockerfile: langgraph_runtime/Dockerfile
    environment:
      LOG_LEVEL: INFO
      ASKPDF_AGENT_CHECKPOINTER: postgres
      AGENT_CHECKPOINT_DATABASE_URL: postgresql://postgres:postgres@postgresql:5432/runtime_checkpoints
      AGENT_RUNTIME_EXECUTION_DATABASE_URL: postgresql://postgres:postgres@postgresql:5432/runtime_checkpoints
      ASKPDF_AGENT_CHECKPOINTER_SETUP: "true"
      MCP_TRANSPORT: loopback_http
      MCP_LOOPBACK_URL: http://rag-service:8000/internal/mcp/
      MCP_REQUEST_TIMEOUT_SECONDS: "120"
      LLM_API_URL: ${EXTERNAL_RUNTIME_LLM_API_URL:-http://fake-llm:9000/v1}
      LLM_AUTH_MODE: none
      LLM_KEYLESS_PROVIDER: local
      OPENAI_API_KEY: ""
      DEFAULT_TOKEN_BUDGET: ${DEFAULT_TOKEN_BUDGET:?DEFAULT_TOKEN_BUDGET must be set in .env}
      REPLANS_LIMIT: ${REPLANS_LIMIT:?REPLANS_LIMIT must be set in .env}
      MAX_CUSTOM_INSTRUCTIONS_CHARS: ${MAX_CUSTOM_INSTRUCTIONS_CHARS:?MAX_CUSTOM_INSTRUCTIONS_CHARS must be set in .env}
      MAX_SYSTEM_ROLE_CHARS: ${MAX_SYSTEM_ROLE_CHARS:?MAX_SYSTEM_ROLE_CHARS must be set in .env}
      AGENT_RUNTIME_DEPENDENCY_REFRESH_SECONDS: "1"
      AGENT_RUNTIME_DEPENDENCY_TIMEOUT_SECONDS: "1"
      AGENT_RUNTIME_DEPENDENCY_STALE_SECONDS: "2"
      AGENT_RUNTIME_DEPENDENCY_JITTER_RATIO: "0.01"
      LANGGRAPH_RUNTIME_TOKEN: langgraph-runtime-integration-token-012345678901234567890123
      LANGGRAPH_RUNTIME_BINDING_SECRET: langgraph-runtime-integration-binding-012345678901234567890123
      MCP_OTEL_ENABLED: "false"
      AGENT_RUNTIME_LEASE_SECONDS: "120"
      AGENT_RUNTIME_CONNECT_TIMEOUT_SECONDS: "30"
      AGENT_RUNTIME_WRITE_TIMEOUT_SECONDS: "300"
      AGENT_RUNTIME_READ_TIMEOUT_SECONDS: "600"
      AGENT_RUNTIME_SHUTDOWN_GRACE_SECONDS: "120"
      AGENT_RUNTIME_CANCEL_CONFIRM_TIMEOUT_SECONDS: "120"
      AGENT_RUNTIME_TERMINAL_CONFIRM_TIMEOUT_SECONDS: "120"
      AGENT_EVENT_POLL_INTERVAL_SECONDS: "1"
      AGENT_SSE_HEARTBEAT_INTERVAL_SECONDS: "12"
      AGENT_CANCELLATION_POLL_INTERVAL_SECONDS: "0.5"
      NEXT_PUBLIC_AGENT_TASK_POLL_INTERVAL_MS: "2000"
      NEXT_PUBLIC_AGENT_SSE_RECONNECT_INTERVAL_MS: "2000"
      AGENT_RUNTIME_RECOVERY_INTERVAL_SECONDS: "30"
      AGENT_RUNTIME_RECOVERY_BATCH_SIZE: "100"
      AGENT_RUNTIME_RECOVERY_LOOP_ENABLED: "true"
      AGENT_RUNTIME_RECONNECT_MAX_ATTEMPTS: "10"
      AGENT_RUNTIME_RECONNECT_BACKOFF_SECONDS: "1"
      AGENT_RUNTIME_RECONNECT_DEADLINE_SECONDS: "600"
      AGENT_RUNTIME_OUTPUT_DELTA_FLUSH_SECONDS: "0.5"
      AGENT_RUNTIME_OUTPUT_DELTA_FLUSH_BYTES: "8192"
      DEEP_AGENT_LANGGRAPH_MAX_MODEL_CALLS: "10000"
      DEEP_AGENT_LANGGRAPH_MAX_MODEL_TOKENS: "500000"
      DEEP_AGENT_LANGGRAPH_MAX_TOOL_CALLS: "100"
      DEEP_AGENT_LANGGRAPH_MAX_ACTIVE_RUNTIME_MS: "7200000"
      DEEP_AGENT_LANGGRAPH_MAX_DURATION_MS: "7200000"
      DEEP_AGENT_LANGGRAPH_MAX_OUTPUT_CHARS: "50000"
      DEEP_AGENT_LANGGRAPH_MAX_EVENT_COUNT: "5000"
      DEEP_AGENT_LANGGRAPH_WAKE_LIMIT_SECONDS: "3600"
      DEEP_AGENT_LANGGRAPH_SUBAGENT_TIMEOUT_MS: "600000"
      DEEP_AGENT_LANGGRAPH_DISPATCH_TIMEOUT_MS: "600000"
      DEEP_AGENT_LANGGRAPH_WORKER_TIMEOUT_MS: "600000"
      DEEP_AGENT_LANGGRAPH_WEB_WORKER_TIMEOUT_MS: "600000"
      DATABASE_URL: ""
      TEST_DATABASE_URL: ""
    env_file: []
    depends_on:
      runtime-checkpoint-db-init:
        condition: service_completed_successfully
      runtime-db-migrate:
        condition: service_completed_successfully
      fake-llm:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8100/readyz"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  fake-llm:
    build:
      context: ./rag_service
      dockerfile: Dockerfile.fake-llm
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/v1/models"]
      interval: 5s
      timeout: 3s
      retries: 12

  hermes-config-init:
    profiles: !reset []
    build:
      context: .
      dockerfile: hermes_runtime/Dockerfile
    command: ["python", "-m", "hermes_runtime.profile_manager"]
    environment:
      API_SERVER_KEY: 7dd5c723b63643e38fc0ccae72a7bf2a8f65c61ad44d4de88e08079b157a55c
      HERMES_MCP_CONTEXT_SECRET: hermes-runtime-hermes-context-secret-32-bytes-minimum
      HERMES_MODEL_CONTEXT_LENGTH: ${HERMES_MODEL_CONTEXT_LENGTH:?HERMES_MODEL_CONTEXT_LENGTH must be set in .env}
      HERMES_MODEL_PROVIDER: lmstudio
      HERMES_DATA_ROOT: /opt/data
      HERMES_CONFIG_TEMPLATE_ROOT: /app/hermes_runtime
      HERMES_PROFILE_ROOT: /opt/data/profiles
      HERMES_PROFILE_UID: "10000"
      HERMES_PROFILE_GID: "10000"
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes:
      - runtime_integration_hermes_data:/opt/data

  hermes:
    profiles: !reset []
    build:
      context: https://github.com/NousResearch/hermes-agent.git#bdd0a79c6a0ebc2344d5d6913c70bd89fa59c894
    environment:
      API_SERVER_ENABLED: "true"
      API_SERVER_HOST: 0.0.0.0
      API_SERVER_PORT: "8642"
      API_SERVER_KEY: 7dd5c723b63643e38fc0ccae72a7bf2a8f65c61ad44d4de88e08079b157a55c
      OPENAI_API_KEY: askpdf-hermes-integration-local
      LLM_API_URL: http://fake-llm:9000/v1
      HERMES_MODEL_CONTEXT_LENGTH: ${HERMES_MODEL_CONTEXT_LENGTH:?HERMES_MODEL_CONTEXT_LENGTH must be set in .env}
      HERMES_MODEL_PROVIDER: lmstudio
      GATEWAY_MULTIPLEX_PROFILES: "true"
      HERMES_UPSTREAM_REVISION: bdd0a79c6a0ebc2344d5d6913c70bd89fa59c894
      ASKPDF_HERMES_COMPAT_ENABLED: "1"
      PYTHONPATH: /opt/askpdf-hermes-pinned-patch
    command: ["gateway"]
    depends_on:
      hermes-config-init:
        condition: service_completed_successfully
      fake-llm:
        condition: service_healthy
      rag-service:
        condition: service_started
    volumes:
      - runtime_integration_hermes_data:/opt/data
      - ./hermes_runtime/hermes_pinned_patch:/opt/askpdf-hermes-pinned-patch:ro
    configs:
      - source: hermes_integration_env
        target: /opt/data/.env
      - source: hermes_integration_env
        target: /opt/data/profiles/askpdf-deep-offline/.env
      - source: hermes_integration_env
        target: /opt/data/profiles/askpdf-deep-external/.env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8642/health"]
      interval: 10s
      timeout: 5s
      retries: 30

  hermes-runtime:
    profiles: !reset []
    build:
      context: .
      dockerfile: hermes_runtime/Dockerfile
    environment:
      LOG_LEVEL: INFO
      HERMES_API_URL: http://hermes:8642
      HERMES_API_TOKEN: 7dd5c723b63643e38fc0ccae72a7bf2a8f65c61ad44d4de88e08079b157a55c
      API_SERVER_KEY: 7dd5c723b63643e38fc0ccae72a7bf2a8f65c61ad44d4de88e08079b157a55c
      OPENAI_API_KEY: askpdf-hermes-integration-local
      LLM_API_URL: http://fake-llm:9000/v1
      ASKPDF_MCP_URL: http://rag-service:8000/internal/mcp/
      ASKPDF_MCP_HEALTH_URL: http://rag-service:8000/health
      ASKPDF_MCP_REQUIRED: "false"
      HERMES_MCP_CONTEXT_SECRET: hermes-runtime-hermes-context-secret-32-bytes-minimum
      HERMES_UPSTREAM_REVISION: bdd0a79c6a0ebc2344d5d6913c70bd89fa59c894
      HERMES_RUNTIME_STATE_PATH: /var/lib/hermes/runtime-state.json
      HERMES_RUNTIME_STORAGE_BACKEND: file
      HERMES_RUNTIME_VERSION: integration
      HERMES_RUNTIME_EVENT_ID_MODE: durable
      HERMES_RUNTIME_WORKERS: "1"
      PYTHONPATH: /workspace:/app
      HERMES_MODEL_CONTEXT_LENGTH: ${HERMES_MODEL_CONTEXT_LENGTH:?HERMES_MODEL_CONTEXT_LENGTH must be set in .env}
      HERMES_MODEL_PROVIDER: lmstudio
      HERMES_PROFILE_ROOT: /opt/data/profiles
      HERMES_PROFILE_UID: "10000"
      HERMES_PROFILE_GID: "10000"
      HERMES_RUN_PROFILE_MAX_AGE_SECONDS: "86400"
      HERMES_RUN_PROFILE_SWEEP_INTERVAL_SECONDS: "60"
      MCP_TRANSPORT: loopback_http
      MCP_LOOPBACK_URL: http://rag-service:8000/internal/mcp/
      MCP_REQUEST_TIMEOUT_SECONDS: "120"
      MCP_OTEL_ENABLED: "false"
      AGENT_RUNTIME_LEASE_SECONDS: "120"
      AGENT_RUNTIME_CONNECT_TIMEOUT_SECONDS: "30"
      AGENT_RUNTIME_WRITE_TIMEOUT_SECONDS: "300"
      AGENT_RUNTIME_READ_TIMEOUT_SECONDS: "600"
      AGENT_RUNTIME_RECONNECT_MAX_ATTEMPTS: "10"
      AGENT_RUNTIME_RECONNECT_BACKOFF_SECONDS: "1"
      AGENT_RUNTIME_RECONNECT_DEADLINE_SECONDS: "600"
      AGENT_RUNTIME_OUTPUT_DELTA_FLUSH_SECONDS: "0.5"
