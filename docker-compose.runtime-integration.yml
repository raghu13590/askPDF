      MAX_SYSTEM_ROLE_CHARS: "500"
      LANGGRAPH_RUNTIME_BINDING_SECRET: langgraph-runtime-integration-binding-secret-012345678901234567890123
      MAX_TOOL_INSTRUCTION_CHARS: "2000"
