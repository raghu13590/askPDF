name: CI

on:
  pull_request:
    branches:
      - main
      - feature/hermes
  push:
    branches:
      - main
      - feature/hermes

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  COMPOSE_FILE: docker-compose.yml:docker-compose.ci.yml
  WEAVIATE_HYBRID_ALPHA: "0.7"
  QUERY_DEFAULTS_LIMIT: "20"
  LOCAL_EMBEDDING_MODEL: BAAI/bge-m3
  LOCAL_RERANKER_MODEL: BAAI/bge-reranker-v2-m3
  EMBEDDING_DEVICE: cpu
  RERANKER_DEVICE: cpu
  SELKIES_CLIPBOARD_ENABLED: "true"
  SELKIES_CLIPBOARD_BRIDGE_ENABLED: "true"
  SELKIES_GAMEPAD_ENABLED: "false"
  SELKIES_UI_SIDEBAR_SHOW_GAMEPADS: "false"
  SELKIES_UI_SIDEBAR_SHOW_GAMING_MODE: "false"
  SELKIES_UI_SIDEBAR_SHOW_SHARING: "false"
  SELKIES_UI_SIDEBAR_SHOW_APPS: "false"
  HERMES_UPSTREAM_REVISION: bdd0a79c6a0ebc2344d5d6913c70bd89fa59c894

jobs:
  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Create clean CI environment
        run: |
          cp .env.ci .env

      - name: Build Docker images
        run: |
          docker compose --env-file .env.ci -f docker-compose.yml -f docker-compose.ci.yml config --quiet
          docker compose --env-file .env.ci -f docker-compose.yml -f docker-compose.ci.yml build

      - name: Verify framework image boundaries
        run: |
          docker build --build-arg DOWNLOAD_LOCAL_MODELS=false -f rag_service/Dockerfile -t askpdf-control-plane .
          docker build -f langgraph_runtime/Dockerfile -t askpdf-langgraph-runtime .
          docker build -f hermes_runtime/Dockerfile -t askpdf-hermes-runtime .
          docker build --build-arg DOWNLOAD_LOCAL_MODELS=false -f rag_service/Dockerfile.test -t askpdf-control-plane-tests .
          docker build -f langgraph_runtime/Dockerfile.test -t askpdf-langgraph-runtime-tests .
          docker run --rm askpdf-control-plane python -c 'import importlib.util; assert importlib.util.find_spec("langgraph") is None; assert importlib.util.find_spec("langgraph_runtime") is None'
          docker run --rm askpdf-langgraph-runtime python -c 'import importlib.util, langgraph, runtime_protocol, langgraph_runtime; assert importlib.util.find_spec("app") is None'
          docker run --rm askpdf-hermes-runtime python -c 'import importlib.util, hermes_runtime, runtime_protocol; assert importlib.util.find_spec("langgraph") is None; assert importlib.util.find_spec("app") is None'
          docker run --rm askpdf-control-plane-tests python -c 'import importlib.util, app, runtime_protocol; assert importlib.util.find_spec("langgraph") is None; assert importlib.util.find_spec("langgraph_runtime") is None'
          docker run --rm askpdf-langgraph-runtime-tests python -c 'import importlib.util, langgraph, langgraph_runtime, runtime_protocol; assert importlib.util.find_spec("app") is None'

      - name: Check diff hygiene
        run: git diff --check

  tests:
    name: Test suite
    runs-on: ubuntu-latest
    needs: docker-build
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Create clean CI environment
        run: |
          cp .env.ci .env

      - name: Run Docker test runner
        run: ./run_tests.sh

      - name: Run Postgres checkpoint/resume test
        run: ./run_tests.sh --agent-checkpoint

      - name: Run mandatory LangGraph runtime proof
        timeout-minutes: 15
        run: ./run_tests.sh --langgraph-runtime

      - name: Stop test services
        if: always()
        run: docker compose -p askpdf-test -f docker-compose.test.yml down --volumes --remove-orphans

  hermes-runtime-proof:
    name: Hermes runtime proof
    runs-on: ubuntu-latest
    needs: docker-build
    timeout-minutes: 20
    env:
      ASKPDF_RUNTIME_TEST_PROJECT_NAME: askpdf-hermes-ci
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Create clean CI environment
        run: |
          cp .env.ci .env

      - name: Run deterministic Hermes proof
        run: ./run_tests.sh --hermes-runtime

      - name: Stop Phase 7 services
        if: always()
        run: docker compose -p askpdf-hermes-ci -f docker-compose.runtime-integration.yml down --volumes --remove-orphans
